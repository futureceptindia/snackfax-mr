<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snackfax</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E8202A; --red-d:#B4141C; --red-soft:#FDF0F1;
  --ink:#000; --ink-2:#3A3A3A; --grey:#8A8A8A; --grey-2:#CCCCCC;
  --line:#E2E2E2; --line-2:#EFEFEF; --soft:#F7F7F7;
  --green:#009B77; --blue:#1B63C4; --gold:#96702A; --gold-soft:#FBF3DF;
  /* grotesk for headlines (Neue Haas stand-in), serif for deks — the Modern Retail signature */
  --sans:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:"Crimson Text",Georgia,"Times New Roman",serif;
  --max:1140px;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:left;padding:0}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{width:min(var(--max),calc(100% - 48px));margin:0 auto;padding:0}
.narrow{max-width:700px;margin:0 auto}

/* ---------- Modern Retail type scale ---------- */
.kick{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--red);display:inline-block}
.kick.g{color:var(--green)} .kick.b{color:var(--blue)}
.hl{font-weight:700;letter-spacing:.7px;line-height:1.2;margin:9px 0 7px;color:#000}
.dt{font-family:var(--sans);font-size:12px;letter-spacing:.5px;color:var(--grey);margin:0 0 10px}
.dek{font-family:var(--serif);font-size:16px;line-height:1.5;color:#000;margin:0}
.lock{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--gold)}
.freetag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--green)}
.ph{background:var(--img) center/cover,var(--line-2)}

/* ---------- prototype bar ---------- */
.proto{position:relative;z-index:500;background:#17181C;color:#fff;display:flex;gap:12px;align-items:center;padding:7px 16px;font-size:12px}
.proto b{letter-spacing:.07em;text-transform:uppercase;font-size:10.5px;color:#868D9C}
.proto .seg{display:flex;background:#25272F;border-radius:999px;padding:3px}
.proto .seg button{padding:4px 11px;border-radius:999px;color:#AEB5C2;font-size:11.5px}
.proto .seg button.on{background:#fff;color:#17181C;font-weight:600}
.proto .hint{margin-left:auto;color:#7C8494}

/* ---------- masthead (Adweek arrangement, Snackfax colours) ---------- */
.mast{position:sticky;top:0;z-index:400;background:#fff;border-bottom:1px solid var(--line)}
.mast .bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 0 14px}
.mast .util-l{display:flex;gap:14px;font-size:16px;color:#000}
.brand{font-weight:800;font-size:33px;letter-spacing:-.025em;color:#000;line-height:1;text-align:center;justify-self:center}
.brand span{color:var(--red)}
.brand small{display:block;font-size:7px;letter-spacing:.32em;color:var(--grey);font-weight:700;margin-top:5px;text-align:center}
.mast .acts{justify-self:end;display:flex;align-items:center;gap:20px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap;color:#000}
.mast .acts button:hover{color:var(--red)}
nav.rail{display:flex;justify-content:center;gap:36px;font-size:14px;font-weight:400;letter-spacing:.5px;text-transform:uppercase;padding:0 0 20px;overflow-x:auto;scrollbar-width:none}
nav.rail::-webkit-scrollbar{display:none}
nav.rail button{padding:2px 0;white-space:nowrap;color:#000}
nav.rail button:hover{color:var(--red)}
nav.rail button.on{color:var(--red)}
nav.rail .fb{display:inline-block;background:var(--green);color:#fff;font-size:8px;padding:2px 4px;margin-left:5px;vertical-align:1.5px;letter-spacing:.5px}

/* ---------- ad slots ---------- */
.ad{border-bottom:1px solid var(--line);background:var(--soft)}
.ad .in{width:min(var(--max),calc(100% - 48px));margin:0 auto;padding:14px 0;text-align:center}
.ad .lb{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);margin-bottom:7px}
.ad .unit{max-width:728px;height:90px;margin:0 auto;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--grey);font-size:12.5px;padding:0 16px}
.ad-in{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;margin:30px 0;text-align:center}
.ad-in .lb{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);margin-bottom:8px}
.ad-in .unit{max-width:560px;margin:0 auto;border:1px solid var(--line);padding:20px;color:var(--grey);font-size:13px}

/* ---------- HOMEPAGE: three-column top block ---------- */
.top3{display:grid;grid-template-columns:259px minmax(0,1fr) 255px;gap:62px;padding:40px 0 40px}
.railL{}
.railR{}

.nl h4{font-weight:700;font-size:21px;letter-spacing:.3px;line-height:1.2;margin:0 0 9px}
.nl p{font-family:var(--serif);font-size:15px;margin:0 0 14px;color:var(--ink-2)}
.nl input{width:100%;border:1px solid var(--line);padding:9px 11px;font-size:13.5px;outline:0;margin-bottom:9px}
.nl button{width:100%;background:var(--green);color:#fff;font-weight:700;font-size:12px;letter-spacing:.9px;text-transform:uppercase;padding:11px;text-align:center}
.nl .ok{font-size:12px;color:var(--green);margin:8px 0 0}
.railBlock{margin-top:34px;border-top:1px solid var(--line);padding-top:16px}
.railBlock h5{font-weight:700;font-size:24px;letter-spacing:.5px;margin:0 0 14px}
.railItem{display:block;width:100%;padding:0 0 18px;margin-bottom:18px;border-bottom:1px solid var(--line-2)}
.railItem:last-of-type{border-bottom:0}
.railItem h6{font-weight:700;font-size:16px;line-height:1.25;letter-spacing:.4px;margin:6px 0 6px}
.railItem:hover h6{color:var(--red)}

.leadStory{display:block;width:100%;text-align:left}
.leadStory .ph{width:100%;aspect-ratio:16/9;margin-bottom:18px}
.leadStory h1.hl{font-size:32px;line-height:38.4px;letter-spacing:.7px;margin:10px 0 8px}
.leadStory:hover h1.hl{color:var(--red)}
.leadStory .dek{font-size:16px}
.leadSubs{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:28px;border-top:1px solid var(--line);padding-top:22px}
.leadSubs button{display:block;width:100%;text-align:left}
.leadSubs h3.hl{font-size:20px;margin:8px 0 6px}
.leadSubs button:hover h3.hl{color:var(--red)}

.onk h4{font-weight:700;font-size:20px;letter-spacing:.5px;margin:0 0 4px}
.onk .sub{font-family:var(--serif);font-size:16px;font-weight:600;margin:0 0 4px}
.onk ul{margin:0;padding:0;list-style:none}
.onk li{border-top:1px solid var(--line);padding:13px 0}
.onk li p{font-family:var(--serif);font-size:15px;line-height:1.45;margin:0;color:#000}
.onk li u{text-decoration-color:var(--red);text-underline-offset:3px;cursor:pointer}
.onk li u:hover{color:var(--red)}

/* ---------- TOP STORIES: giant stamp + text-only 3-up ---------- */
.tsWrap{border-top:1px solid var(--line);margin-top:40px;padding-top:40px}
.tsGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px}
.stamp{font-weight:700;font-size:64px;line-height:.94;letter-spacing:-1px}
.stamp span{display:block;color:var(--grey-2);font-size:72px;line-height:72px}
.tsItem{display:block;width:100%;text-align:left}
.tsItem h3.hl{font-size:20px;line-height:28px;letter-spacing:.7px;margin:9px 0 7px}
.tsItem:hover h3.hl{color:var(--red)}

/* ---------- topic sections ---------- */
.sec{display:flex;align-items:center;gap:20px;margin:56px 0 28px}
.sec h2{font-weight:700;font-size:32px;line-height:41.6px;letter-spacing:.7px;margin:0}
.sec .line{flex:1;height:1px;background:var(--line)}
.sec .vm{font-size:12px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;white-space:nowrap}
.sec .vm:hover{color:var(--red)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px}
.card{display:block;width:100%;text-align:left}
.card .ph{width:100%;aspect-ratio:1.8;margin-bottom:16px}
.card h3.hl{font-size:20px;line-height:28px;letter-spacing:.7px;margin:9px 0 7px}
.card:hover h3.hl{color:var(--red)}

/* ---------- shorts band ---------- */
.shortsBand{background:#fff;padding:0;margin-top:0;border-top:1px solid var(--line);margin-top:48px;padding-top:6px}
.shortsBand .sec{margin:34px 0 22px}
.shortsBand .freetag{border:1px solid var(--green);padding:3px 8px}
.reel{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:none}
.reel::-webkit-scrollbar{display:none}
.sc{flex:none;width:182px;scroll-snap-align:start;text-align:left}
.sc .ph{width:182px;height:312px;position:relative;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.7)),var(--img) center/cover,#7A0E15}
.sc .d{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.6);font-size:11px;font-weight:700;padding:2px 6px}
.sc .lv{position:absolute;top:10px;left:10px;background:#fff;color:var(--red);font-size:9.5px;font-weight:800;padding:3px 7px;letter-spacing:.5px}
.sc h4{font-weight:700;font-size:16px;line-height:1.25;letter-spacing:.4px;margin:13px 0 5px;color:#000}
.sc p{margin:0;font-size:12px;color:var(--grey)}

/* ---------- category page ---------- */
.catHero{border-bottom:1px solid var(--line);padding:40px 0 26px}
.catHero h1{font-weight:700;font-size:44px;letter-spacing:-.5px;margin:0 0 10px;line-height:1.05}
.catHero p{max-width:640px;margin:0;font-family:var(--serif);font-size:17px;color:var(--ink-2)}
.catLatest{font-weight:700;font-size:28px;letter-spacing:.5px;margin:30px 0 0;display:inline-block}
.catLatest:after{content:"";display:block;height:2px;background:#000;margin-top:8px}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:28px;padding:26px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;align-items:start}
.catrow h3{font-weight:700;font-size:24px;line-height:1.25;letter-spacing:.5px;margin:9px 0 9px}
.catrow:hover h3{color:var(--red)}
.catrow .by{font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase}
.catrow .by em{font-style:normal;color:var(--grey)}
.catrow .rf{font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--red);margin-top:12px;display:inline-block}
.catrow .ph{aspect-ratio:4/3}

/* ---------- article ---------- */
.art h1{font-weight:700;font-size:38px;line-height:1.16;letter-spacing:.3px;margin:12px 0 14px}
.art .stand{font-family:var(--serif);font-size:19px;line-height:1.5;color:var(--ink-2);margin:0 0 22px}
.byline{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:24px;font-size:12px}
.byline .av{width:38px;height:38px;border-radius:50%;background:var(--img) center/cover,var(--line-2);flex:none}
.byline .nm{font-weight:700;letter-spacing:.9px;text-transform:uppercase}
.byline .dd{color:var(--grey);letter-spacing:.5px}
.byline .a{margin-left:auto;display:flex;gap:8px}
.byline .a button{border:1px solid var(--line);padding:7px 13px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.art .hero{width:100%;aspect-ratio:16/9;margin-bottom:7px}
.art .cap{font-size:11.5px;color:var(--grey);margin:0 0 28px;padding-bottom:16px;border-bottom:1px solid var(--line-2)}
.art p.b{font-family:var(--serif);font-size:19px;line-height:1.62;margin:0 0 22px}
.art h2.s2{font-weight:700;font-size:24px;letter-spacing:.5px;margin:36px 0 14px}
.kp{border-left:3px solid var(--red);padding:2px 0 2px 20px;margin:0 0 26px}
.kp h4{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--red);margin:0 0 9px}
.kp ul{margin:0;padding-left:17px;font-family:var(--serif);font-size:16.5px;line-height:1.55;color:var(--ink-2)}
.pull{font-weight:700;font-size:23px;line-height:1.3;letter-spacing:.5px;border-top:2px solid #000;border-bottom:2px solid #000;padding:18px 0;margin:30px 0}

/* paywall */
.fade{height:120px;margin-top:-120px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 80%);position:relative;pointer-events:none}
.wall{border:1px solid var(--line);border-top:4px solid var(--red);padding:32px;text-align:center;margin-bottom:30px}
.wall h3{font-weight:700;font-size:26px;letter-spacing:.4px;line-height:1.25;margin:12px 0 9px}
.wall p.s{font-family:var(--serif);font-size:16.5px;color:var(--ink-2);max-width:46ch;margin:0 auto 22px}
.wall .cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.wall .primary{background:var(--red);color:#fff;font-weight:700;font-size:12px;letter-spacing:.9px;text-transform:uppercase;padding:14px 26px}
.wall .ghost{border:1px solid #000;font-weight:700;font-size:12px;letter-spacing:.9px;text-transform:uppercase;padding:14px 26px}
.wall .inc{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:26px;border-top:1px solid var(--line);padding-top:22px;text-align:left}
.wall .inc b{display:block;font-weight:700;font-size:15px;margin-bottom:4px}
.wall .inc span{font-family:var(--serif);font-size:15px;color:var(--ink-2)}
.wall .note{font-size:12px;color:var(--grey);margin-top:18px}

/* ---------- shorts feed / players / misc ---------- */
.sfeed{max-width:400px;margin:22px auto 0;height:min(72vh,640px);overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;background:#000}
.sfeed::-webkit-scrollbar{display:none}
.sfeed .p{height:100%;scroll-snap-align:start;position:relative;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:22px 74px 26px 22px;
  background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.02) 38%,rgba(0,0,0,.86)),var(--img) center/cover,#1A1C21}
.sfeed .p h3{font-weight:700;font-size:21px;line-height:1.22;margin:9px 0 5px;letter-spacing:.4px}
.sfeed .p .v{font-size:12.5px;color:#C9CDD5}
.sfeed .rail{position:absolute;right:14px;bottom:30px;display:flex;flex-direction:column;gap:20px;text-align:center;font-size:10.5px}
.sfeed .rail button em{display:block;font-style:normal;font-size:21px;margin-bottom:2px}
.sfeed .bar{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.22)}
.sfeed .bar b{display:block;height:100%;width:44%;background:var(--red)}

.player{border:1px solid var(--line);padding:22px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.player .cv{width:90px;height:90px;background:#000;color:#fff;display:grid;place-content:center;text-align:center;font-weight:800;font-size:13px;line-height:1.2;flex:none;letter-spacing:.5px}
.player .m{flex:1;min-width:240px}
.wave{display:flex;align-items:flex-end;gap:2px;height:34px;margin:11px 0;width:100%}
.wave b{flex:1;background:var(--line)}
.wave b.p{background:var(--red)}
.ctr{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--grey);flex-wrap:wrap}
.ctr .pp{width:38px;height:38px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center}
.spd{border:1px solid var(--line);padding:5px 10px;font-size:11.5px;font-weight:700}
.chaps{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.chaps button{border:1px solid var(--line);padding:6px 11px;font-size:11.5px;color:var(--ink-2)}
.chaps button.on{background:#000;color:#fff;border-color:#000}
.ep{display:flex;gap:18px;padding:22px 0;border-bottom:1px solid var(--line);align-items:center;width:100%;text-align:left}
.ep .cv{width:72px;height:72px;background:#000;color:#fff;display:grid;place-content:center;font-weight:800;font-size:11px;text-align:center;flex:none;line-height:1.2}
.ep h3{font-weight:700;font-size:19px;letter-spacing:.4px;margin:5px 0 5px}
.ep .go{margin-left:auto;border:1px solid #000;padding:9px 16px;font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;flex:none}

.logline{border-left:2px solid var(--line);padding:0 0 20px 18px}
.logline.hot{border-color:var(--red)}
.logline time{font-size:11px;font-weight:700;letter-spacing:.9px;color:var(--grey)}
.logline p{font-family:var(--serif);font-size:16.5px;margin:5px 0 0}

.pagehead{border-bottom:1px solid var(--line);padding:34px 0 22px}
.pagehead h1{font-weight:800;font-size:42px;letter-spacing:.5px;margin:0 0 8px}
.pagehead p{font-family:var(--serif);font-size:17px;margin:0;color:var(--ink-2);max-width:64ch}
.crumb{font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--grey);padding-top:26px}
.crumb button{color:var(--red)}
.empty{border:1px solid var(--line);padding:56px 24px;text-align:center}
.empty h2{font-weight:700;font-size:24px;margin:0 0 8px}
.person{border:1px solid var(--line);padding:22px;width:100%;text-align:left}
.person .av{width:58px;height:58px;border-radius:50%;background:var(--img) center/cover,var(--line-2);margin-bottom:12px}
.person h3{font-weight:700;font-size:18px;margin:0 0 4px}
.person .role{font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--red);margin-bottom:9px}
.person p{font-family:var(--serif);font-size:15px;margin:0;color:var(--ink-2)}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:26px 0}
.plan{border:1px solid var(--line);padding:26px}
.plan.best{border:2px solid var(--red);position:relative}
.plan.best:before{content:"RECOMMENDED";position:absolute;top:-10px;left:26px;background:var(--red);color:#fff;font-size:9.5px;font-weight:700;letter-spacing:.9px;padding:3px 9px}
.plan h3{font-weight:800;font-size:20px;letter-spacing:.5px;text-transform:uppercase;margin:0 0 6px}
.plan .pr{font-weight:700;font-size:32px;margin:0}
.plan .pr span{font-size:13px;color:var(--grey);font-weight:400}
.plan ul{margin:18px 0 22px;padding-left:18px;font-family:var(--serif);font-size:16px;line-height:1.7;color:var(--ink-2)}
.plan button{width:100%;text-align:center;padding:12px;font-weight:700;font-size:11.5px;letter-spacing:.9px;text-transform:uppercase;border:1px solid #000}
.plan.best button{background:var(--red);color:#fff;border-color:var(--red)}
.signup{border:1px solid var(--line);padding:24px;margin-top:28px}
.signup h4{font-weight:700;font-size:20px;margin:0 0 6px}
.signup p{font-family:var(--serif);font-size:16px;margin:0 0 14px;color:var(--ink-2)}
.signup form{display:flex;gap:9px;flex-wrap:wrap}
.signup input{flex:1;min-width:200px;border:1px solid var(--line);padding:10px 12px;outline:0}
.signup button{background:var(--green);color:#fff;font-weight:700;font-size:12px;letter-spacing:.9px;text-transform:uppercase;padding:11px 22px}
.signup .ok{font-size:13px;color:var(--green);margin:12px 0 0}

/* footer */
footer{border-top:3px solid #000;margin-top:56px;padding:40px 0 48px;font-size:14px}
footer .f{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:34px}
footer .brand{font-size:26px}
footer h5{font-weight:700;font-size:12px;letter-spacing:.9px;text-transform:uppercase;margin:0 0 12px}
footer ul{margin:0;padding:0;list-style:none;line-height:2.1;color:var(--ink-2)}
footer ul button:hover{color:var(--red)}
footer p{font-family:var(--serif);font-size:15px;color:var(--ink-2)}
footer .legal{border-top:1px solid var(--line);margin-top:34px;padding-top:18px;font-size:12px;color:var(--grey);display:flex;gap:20px;flex-wrap:wrap}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:700;display:none;align-items:flex-start;justify-content:center;padding:80px 20px;overflow-y:auto}
.ov.on{display:flex}
.modal{background:#fff;width:100%;max-width:520px;padding:30px}
.modal h3{font-weight:700;font-size:24px;margin:0 0 7px}
.modal p.s{font-family:var(--serif);font-size:16px;color:var(--ink-2);margin:0 0 18px}
.modal input{width:100%;border:1px solid var(--line);padding:11px 13px;margin-bottom:9px;outline:0}

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const I=n=>`img/${n}.jpg`;

/* ======================= DATA ======================= */
const NAV=[{id:'technology',n:'Technology'},{id:'brands',n:'Brands'},{id:'retail',n:'Retail'},
  {id:'money',n:'Money'},{id:'trends',n:'Trends'},{id:'founders',n:'Founders'},
  {id:'shorts',n:'Shorts',free:1},{id:'podcasts',n:'Podcasts'},{id:'events',n:'Events'}];
const SEC={
  technology:{n:'Technology',b:'The systems underneath Indian food and retail — pricing engines, dark-store software, demand forecasting, and the AI everyone is piloting but few are running.'},
  brands:{n:'Brands',b:'What Indians put in the trolley, who makes it, and the distribution fights that decide which brand takes the shelf.'},
  retail:{n:'Retail',b:'Store formats, quick commerce and the economics of getting a product into someone\'s hands in ten minutes.'},
  money:{n:'Money',b:'Rounds, valuations and margins. We read the cap table, not the press release.'},
  trends:{n:'Trends',b:'The categories moving fastest, and an honest read on which are real.'},
  founders:{n:'Founders',b:'Operators on the decisions that shaped the business, including the ones that did not work.'},
  policy:{n:'Policy',b:'FSSAI, labelling and the regulation that reshapes a product long before it reaches a shelf.'},
  global:{n:'Global',b:'Supply chains and the overseas shifts that land on an Indian menu two quarters later.'},
  events:{n:'Events',b:'Snackfax briefings, roundtables and the annual summit. Members get first access.'}
};
const AU={
  ra:{id:'ra',n:'Rhea Anand',r:'Retail & quick commerce',img:I('founder'),b:'Six years covering Indian grocery retail. Before Snackfax she tracked supply chains at a trade weekly.'},
  km:{id:'km',n:'Kabir Mehta',r:'Brands & consumer',img:I('founder2'),b:'Writes about what Indians put in their trolley and why. Previously a category manager at an FMCG major.'},
  sn:{id:'sn',n:'Simran Nair',r:'Money & deals',img:I('salad'),b:'Follows the cheques — rounds, valuations and the unit economics behind them.'},
  dv:{id:'dv',n:'Dev Iyer',r:'Technology',img:I('dark'),b:'Covers the software layer: pricing engines, forecasting, and which AI pilots actually reached production.'}
};
const P=(...a)=>a;
const ST=[
 {id:'agentic',sec:'technology',k:'AI STRATEGIES',kc:'b',lead:1,
  t:'How Zepto, BigBasket and Swiggy are building their agentic shopping assistants',
  d:'Three of India\'s biggest grocery platforms outlined how far they will let an assistant go. Most of the argument is about who is liable when it orders wrong.',
  img:I('dark'),date:'September 29, 2026',read:'6 min read',au:'dv',
  kp:['All three are piloting; none has an assistant placing unsupervised orders.','The blocker is returns liability, not model quality.','Reorder lists work. Discovery does not.'],
  body:P('Every large grocery platform in India is now building some version of an agentic assistant, and every one of them has stopped at the same wall: nobody wants to own the order the machine got wrong.',
   'The demos are genuinely good. Tell it you are cooking for six on Thursday and it builds a basket. In testing, the baskets are sensible. The problem arrives at the doorstep, where a wrong substitution is not a model error — it is a refund, a rider, and a customer who now distrusts the app.',
   'So the live deployments are narrow. Reorder assistance works, because the assistant is matching against what you already bought. Discovery does not, because the platform cannot yet defend a recommendation it cannot explain.',
   'One head of product put it plainly: the assistant is allowed to fill the cart, but a human still presses buy. Until the returns maths changes, that is where this sits.',
   'Watch the substitution logic rather than the chat interface. That is the part that decides whether any of this survives contact with a Thursday evening.')},

 {id:'zomato',sec:'brands',k:'BRAND LAUNCH',sub:1,
  t:'Zomato launches a burger brand across 10 cities',
  d:'The new brand runs entirely on cloud kitchens, starting with Bengaluru, Delhi and Mumbai. The economics are the point, not the burger.',
  img:I('burger'),date:'September 29, 2026',read:'4 min read',au:'km',
  kp:['10 cities at launch; three go first.','No storefront capex — it rides existing kitchen capacity.','Lands at ₹180–260, above QSR value menus.'],
  body:P('Zomato is launching a burger brand of its own, built entirely on cloud kitchens, with 10 cities in the first phase. Bengaluru, Delhi and Mumbai open this month.',
   'The economics are the point. A dine-in chain spends on rent, fit-out and staff before it sells anything. A cloud kitchen riding on capacity the company already leases spends almost none of that, and the delivery rails are already owned.',
   'Three people familiar with the plan say the brand will sit in the ₹180–260 band — above the QSR value menus, below the imported-patty specialists. That is deliberate: it is the band where app orders grew fastest last year and where no single chain has taken the category.',
   'What it does not do is threaten McDonald\'s or Burger King directly. Those chains sell footfall and family occasions as much as food. The pressure lands on the mid-market — the 20-to-60-outlet regional chains that took delivery seriously late and now pay commission on orders they used to own.',
   'The open question is supply. A patty programme at this scale needs a cold chain that holds in July, and the company has not said who is making them.')},

 {id:'zepto',sec:'retail',k:'STORE FORMATS',kc:'g',sub:1,
  t:'Zepto\'s new store format is a bet on fresh produce',
  d:'Bigger floor, shorter aisles, and a cold chain built for ten-minute delivery. It only works above 3,000 orders a day.',
  img:I('store'),date:'September 29, 2026',read:'6 min read',au:'ra',
  kp:['Floor is roughly 2.5× a standard dark store.','Fresh goes from 4% of the basket to a target of 18%.','Below 3,000 daily orders it does not pay for itself.'],
  body:P('The new Zepto format is bigger, colder and slower to build — and that is the whole idea. Fresh produce is the category that keeps a grocery customer coming back weekly rather than monthly, and it is the one quick commerce has been worst at.',
   'Walk one and the difference is obvious. The aisles are shorter, so a picker\'s longest walk drops. A third of the floor is refrigerated, against almost none in a standard dark store. There is a sorting bench, which no dark store has, because produce arrives ungraded and leaves graded.',
   'Company material puts fresh at about 4% of the current basket, with a target near 18%. That is not a nudge. It is a different business, with spoilage risk attached.',
   'Below roughly 3,000 orders a day the refrigeration and the extra staff do not pay for themselves, which is why this is a format for a few hundred locations, not a few thousand.')},

 {id:'pricing',sec:'technology',k:'INSIDE THE STACK',
  t:'The pricing engine quietly running India\'s quick-commerce war',
  d:'Prices on the three big apps now move several times a day, per dark store. Almost none of it is a person.',
  img:I('aisle'),date:'September 28, 2026',read:'7 min read',au:'dv',
  kp:['Prices reprice multiple times a day, per store.','Competitor scraping is continuous and mutual.','Margin floors are set per category, not per SKU.'],
  body:P('The visible part of the price war is a ₹2 handling fee. The invisible part is a repricing system watching competitors continuously and moving prices per dark store, several times a day.',
   'Each platform scrapes the others. All of them know this. A cut in one catchment propagates within the hour, which is why these wars escalate faster than anyone intends.',
   'The guardrail is a margin floor set per category rather than per SKU, so a platform can go negative on onions if the basket recovers on staples.',
   'That one design decision is why a price war can run for six days without anybody technically approving a loss.')},

 {id:'forecast',sec:'technology',k:'OPERATIONS',kc:'g',
  t:'Demand forecasting cut fresh waste by a third — at two companies out of nine',
  d:'The models work. The reason most deployments fail is upstream of the model, in data nobody owns.',
  img:I('salad'),date:'September 26, 2026',read:'5 min read',au:'dv',
  kp:['Two of nine deployments hit their waste target.','Failures trace to late inbound data, not model choice.','Override rights decide the outcome.'],
  body:P('Nine companies told us they deployed demand forecasting on fresh. Two hit their waste-reduction target. The gap is not the model.',
   'The failures share a pattern: inbound supply data that is entered late, manually, or not at all. A forecast fed yesterday\'s truck as though it arrived on time is confidently wrong.',
   'The second pattern is override rights. Where store managers could freely override the system, they did — roughly 40% of the time — and waste stayed flat. Where overrides required a reason code, usage dropped and the numbers moved.',
   'That is a management change wearing a technology badge.')},

 {id:'salad',sec:'money',k:'FUNDING',
  t:'Salad-based D2C brand raises ₹42 Cr in Series B',
  d:'Led by an existing investor at a flat-to-modest step up. The money goes to a second kitchen, not new cities.',
  img:I('salad'),date:'September 29, 2026',read:'3 min read',au:'sn',
  kp:['₹42 Cr, led by an existing investor.','34 outlets; contribution-positive in Bengaluru only.','Capital earmarked for a kitchen, not a land grab.'],
  body:P('A ₹42 crore Series B into a salad chain sounds like 2021. It is not. The round is led by an existing investor at a flat-to-modest step up, and the money is earmarked for a second central kitchen rather than a rollout.',
   'The chain is at 34 outlets. It says contribution margin is positive in Bengaluru and roughly breakeven in Hyderabad. Delhi is not mentioned, which usually means Delhi is not working yet.',
   'Investors are back on food service, but only where the unit economics are already proven in at least one city. Funding a 60-city rollout off one good store is over.')},

 {id:'dmart',sec:'retail',k:'QUICK COMMERCE',
  t:'DMart expands into quick commerce — deliberately slowly',
  d:'A Pune-only pilot, two-hour slots, no ten-minute promise. Everything about it is designed to protect cost.',
  img:I('aisle'),date:'September 28, 2026',read:'4 min read',au:'ra',
  kp:['Pune only, two-hour delivery windows.','Picks from existing stores — no dark stores.','Shelf price, no surcharge above ₹999.'],
  body:P('DMart has started a quick-commerce pilot in Pune, and everything about it is designed to be boring. Two-hour slots, not ten minutes. Picking out of existing stores, not new dark stores. Shelf price, no surcharge above a ₹999 basket.',
   'That is a strategy, not timidity. DMart\'s entire advantage is cost, and ten-minute delivery destroys cost. A two-hour window lets one picker batch eight orders and keeps the promise inside what a store can already do.',
   'If it works, the pressure on Blinkit and Instamart is not on speed. It is on price, in the weekly stock-up basket where DMart has never been beaten.')},

 {id:'protein',sec:'trends',k:'CATEGORY WATCH',kc:'b',
  t:'Why protein chocolates are suddenly everywhere',
  d:'Nine launches in six months, most of them from companies that made only whey a year ago. The asset is distribution, not the recipe.',
  img:I('choc'),date:'September 28, 2026',read:'4 min read',au:'km',
  kp:['Nine launches in six months.','Gym and pharmacy reach is the real moat.','Retail margin is roughly double a standard bar.'],
  body:P('Nine protein chocolate launches in six months is not a trend, it is a queue. And most of them are not chocolate companies.',
   'The reason is distribution. A whey brand already sells into 4,000 gyms and a handful of pharmacy chains. A bar at ₹99 with 10g of protein moves through that pipe without a single new conversation, and the recipe is contract-manufactured.',
   'Margins help. A ₹20 chocolate bar leaves a retailer a few rupees. A ₹99 protein bar leaves several times that, for the same shelf space.',
   'Watch repeat rate at month four. Novelty carries the first three.')},

 {id:'yogabar',sec:'founders',k:'FOUNDER INTERVIEW',
  t:'"We said no to modern trade for two years"',
  d:'The Yogabar founder on holding one SKU until it earned the range, and why 500 stores was the output rather than the goal.',
  img:I('founder2'),date:'September 28, 2026',read:'9 min read',au:'km',
  kp:['Refused large-format retail for two years.','Held one SKU until repeat purchase cleared a bar.','Roughly 500 stores today.'],
  body:P('"We said no to every large-format retailer for two years," she says, which at the time read as either discipline or arrogance. It was discipline.',
   'The argument: a shelf in modern trade costs listing fees, slotting and a returns liability, and teaches you nothing about whether people want the product. One SKU in 40 independent stores teaches you everything, for a fraction of the cost.',
   'They held that SKU until repeat purchase cleared an internal bar. Only then did the range widen, and only then did the big chains get a yes.',
   'Five hundred stores later, the sequencing is the lesson, not the number.')},

 {id:'itc',sec:'brands',k:'CATEGORY ENTRY',
  t:'ITC to enter protein snacks. The product is unremarkable; the six million outlets are not.',
  d:'Challenger brands spent four years building gym reach one conversation at a time. ITC already paid for the pipe.',
  img:I('choc'),date:'September 29, 2026',read:'3 min read',au:'km',
  kp:['Launching through existing ITC distribution.','Targets the ₹99–₹149 band.','Squeezes the challengers\' only real moat.'],
  body:P('When ITC enters a category the product is rarely the news. The distribution is.',
   'Challenger protein brands spent four years building gym and pharmacy reach one conversation at a time. ITC has a route to roughly six million outlets already paid for. A comparable bar at ₹99 does not need to be better to hurt.',
   'What the challengers still hold is credibility with the actual gym-going buyer — a small market that sets taste for a much larger one.')},

 {id:'farmley',sec:'brands',k:'PRIVATE LABEL',kc:'g',
  t:'Zepto\'s private label is made by a brand it competes with',
  d:'A dried-fruit range under Zepto\'s own name, manufactured by Farmley, sold beside Farmley.',
  img:I('salad'),date:'September 29, 2026',read:'3 min read',au:'ra',
  kp:['Private label manufactured by Farmley.','Dried fruit: high margin, long shelf life, weak brand loyalty.','Brands now compete with their own contract manufacturer.'],
  body:P('Dried fruit is the correct first private label for a quick-commerce platform: high margin, long shelf life, no cold chain, and the customer does not have a strong brand preference.',
   'The awkward part is structural. Farmley sells its own branded range on the same app it now manufactures a competitor for. Every platform that has gone down this road has ended up in the same conversation about shelf placement and search ranking.',
   'Expect the third-party brands to raise it long before the regulator does.')},

 {id:'100bn',sec:'money',k:'THE NUMBERS',
  t:'India\'s packaged food market to hit $100 Bn by 2030',
  d:'The headline number is fine. The mix underneath it is the story worth reading.',
  img:I('aisle'),date:'September 29, 2026',read:'5 min read',au:'sn',
  kp:['$100 Bn by 2030 on the base case.','Growth concentrates in ready-to-cook and healthier snacking.','Staples grow with population, not preference.'],
  body:P('Every few months a new forecast puts Indian packaged food at $100 billion by 2030. Treat the headline as directional and read the mix.',
   'Staples grow roughly with population and income. The interesting growth sits in ready-to-cook, chilled and what the decks call better-for-you snacking — categories where a new brand can actually take share because habits are not yet set.',
   'For anyone allocating capital, the number that matters is not the market size. It is how much of the growth is available to a company that does not already own distribution.')},

 {id:'blinkit',sec:'retail',k:'BREAKING',
  t:'Blinkit pauses its ten-minute pilot in two cities',
  d:'The company calls it a route optimisation reset. Riders were paid per trip on routes that could not be run.',

       <span class="kick" style="color:var(--grey);margin-left:8px">${n[1]}</span>

       <p class="dek" style="margin-top:5px">${n[2]}</p></div></label>`).join('')}
  <div class="narrow">${signup()}</div>
  </div>${foot()}`;

V.about=()=>`<div class="wrap">
  <div class="pagehead"><h1>About</h1><p>A newsroom covering food, brands and retail in India. Small team, fast metabolism, no press-release reprints.</p></div>
  <div class="narrow art" style="padding-top:30px">
  <p class="b">Most of what we publish runs under 600 words, because most of what happens in this industry can be explained in under 600 words. When something genuinely needs 3,000, we write 3,000 and say why at the top.</p>
  <h2 class="s2">What stays free</h2>
  <p class="b">Shorts. All of them, for everyone, permanently. If you only ever watch the sixty-second version you will still know what happened. Membership pays for the reporting behind it.</p>
  <h2 class="s2">How we are funded</h2>
  <p class="b">Membership first, advertising second and always marked. Sponsored posts carry the label at the top, not in the footer. We do not take payment to cover a company, and we do not send stories for approval before publication.</p>
  <h2 class="s2">Corrections</h2>
  <p class="b">Every correction stays on the page with a timestamp. We do not quietly edit.</p>
  ${sec('The newsroom')}
  <div class="g3" style="grid-template-columns:1fr 1fr">${Object.values(AU).map(a=>`
    <button class="person" data-go="author:${a.id}"><div class="av" style="--img:url('${a.img}')"></div>
      <h3>${a.n}</h3><div class="role">${a.r}</div><p>${a.b}</p></button>`).join('')}</div>
  </div></div>${foot()}`;

V.author=id=>{
  const a=AU[id]||AU.ra, list=ST.filter(s=>s.au===a.id);
  return `<div class="wrap"><div class="narrow">
    <div class="crumb"><button data-go="home">Home</button> › ${a.n}</div>
    <div style="display:flex;gap:18px;align-items:center;margin:24px 0 10px">
      <div class="ph" style="width:72px;height:72px;border-radius:50%;--img:url('${a.img}')"></div>
      <div><h1 style="font-weight:700;font-size:30px;margin:0;letter-spacing:.4px">${a.n}</h1>
        <div class="kick" style="margin-top:5px">${a.r}</div></div></div>
    <p class="dek" style="font-size:17px">${a.b}</p>
    ${sec(list.length+' stories')}
    ${list.map(catRow).join('')}
  </div></div>${foot()}`;
};

V.saved=()=>{
  const list=[...S.saved].map(byId).filter(Boolean);
  return `<div class="wrap"><div class="narrow">
    <div class="pagehead"><h1>Saved</h1><p>Stories you kept for later. Members keep them across devices.</p></div>
    <div style="margin-top:22px">${list.length?list.map(catRow).join(''):
      `<div class="empty"><h2>Nothing saved yet</h2>
       <p class="dek" style="margin-bottom:16px">Use Save on any story page.</p>
       <button style="border:1px solid #000;padding:12px 26px;font-weight:700;font-size:11.5px;letter-spacing:.9px;text-transform:uppercase" data-go="home">Back to the homepage</button></div>`}</div>
  </div></div>${foot()}`;
};

V.search=q=>{
  const ql=(q||'').toLowerCase();
  const res=ql?ST.filter(s=>(s.t+s.d+s.k+s.sec).toLowerCase().includes(ql)):[];
  return `<div class="wrap"><div class="narrow">
    <div class="pagehead"><h1>Search</h1><p>“${esc(q)}” — ${res.length} result${res.length===1?'':'s'}</p></div>
    <div style="margin-top:22px">${res.length?res.map(catRow).join(''):
      `<div class="empty"><h2>No match</h2><p class="dek">Try “quick commerce”, “AI”, “protein”, “matcha” or “DMart”.</p></div>`}</div>
  </div></div>${foot()}`;
};

function player(p){
  return `<div class="player" data-player="${p.id}">
    <div class="cv">${p.day.replace(' ','<br>')}</div>
    <div class="m">
      <div style="font-weight:700;font-size:17px;letter-spacing:.4px" data-now>${p.ch[0][0]}</div>
      <div class="wave" data-wave></div>
      <div class="ctr"><button class="pp" data-pp>▶</button><span data-cur>0:00</span> / <span>${p.len}</span>
        <button class="spd" data-spd>1.0×</button>
        <span style="margin-left:auto">${S.member?'Full episode':'Chapter 1 free · '+p.ch.length+' chapters for members'}</span></div>
      <div class="chaps" data-chaps>${p.ch.map((c,i)=>`<button class="${i?'':'on'}">${i&&!S.member?'🔒 ':''}${c[0]}</button>`).join('')}</div>
    </div></div>`;
}

/* ======================= ROUTER ======================= */
function go(spec){
  const [v,arg]=String(spec).split(':');
  S.route={v,arg}; render();
  const m=document.body.classList.contains('m');
  if(m)$('#phSc').scrollTop=0; else scrollTo(0,0);
}
function render(){
  const {v,arg}=S.route;
  const html=v==='section'?V.section(arg):v==='story'?V.story(arg):v==='author'?V.author(arg)
    :v==='search'?V.search(decodeURIComponent(arg||'')):(V[v]||V.home)();
  $('#app').innerHTML=html;
  const act=v==='section'?'section:'+arg:v;
  $$('#nav button,#phTabs button').forEach(b=>b.classList.toggle('on',b.dataset.go===act));
  $$('#mobNav button,#phNav button').forEach(b=>b.classList.toggle('on',
    b.dataset.go===act||(v==='home'&&b.dataset.go==='home')));
  $('#signBtn').textContent=S.member?'My account':'Sign In';
  wire();
}
const navHTML=NAV.map(n=>`<button data-go="${['shorts','podcasts'].includes(n.id)?n.id:'section:'+n.id}">${n.n}${n.free?'<span class="fb">FREE</span>':''}</button>`).join('');
$('#nav').innerHTML=navHTML; $('#phTabs').innerHTML=navHTML;

document.addEventListener('click',e=>{
  const sv=e.target.closest('[data-save]');
  if(sv){e.stopPropagation();const id=sv.dataset.save;S.saved.has(id)?S.saved.delete(id):S.saved.add(id);render();return}
  const st=e.target.closest('[data-s]'); if(st){go('story:'+st.dataset.s);return}
  const pd=e.target.closest('[data-pod]');
  if(pd){const p=PODS.find(x=>x.id===pd.dataset.pod);
    modal(S.member?`<h3>${esc(p.t)}</h3><p class="s">${p.day} · ${p.len}</p>${player(p)}
      <button class="go" data-close>Close</button>`
     :`<span class="lock">🔒 Member exclusive</span><h3 style="margin-top:10px">${esc(p.t)}</h3>
       <p class="s">${p.day} · ${p.len} · chapter one is free</p>${player(p)}
       <button class="go" data-go="subscribe">See membership</button>`); wire(); return}
  const g=e.target.closest('[data-go]'); if(g){closeModal();go(g.dataset.go);return}
  if(e.target.closest('[data-close]')||e.target.classList.contains('ov'))closeModal();
  if(e.target.id==='wallSign'||e.target.id==='signBtn'){S.member?account():signIn()}
  if(e.target.id==='joinBtn'){setMember(true);
    modal(`<h3>You're a member</h3><p class="s">Prototype only — nothing was charged.</p>
      <p class="dek">Every story is unlocked. Use the switch in the grey bar to see the signed-out view again.</p>
      <button class="go" data-go="home">Read everything</button>`)}
});

const ovEl=()=>document.body.classList.contains('m')?$('#ovM'):$('#ov');
function modal(h){const o=ovEl();o.innerHTML=`<div class="modal">${h}</div>`;o.classList.add('on')}
function closeModal(){$$('.ov').forEach(o=>o.classList.remove('on'))}
function signIn(){
  modal(`<h3>Sign in</h3><p class="s">Members get every story, the daily brief and the live files.</p>
    <input type="email" placeholder="Email"><input type="password" placeholder="Password">
    <button class="go" id="siGo">Sign in</button>
    <p style="text-align:center;margin:14px 0 0;font-size:13.5px;color:var(--grey)">
      No account? <button style="color:var(--red);font-weight:700" data-go="subscribe">See membership</button></p>`);
  setTimeout(()=>{const b=$('#siGo');if(b)b.onclick=()=>{setMember(true);closeModal();render()}},20);
}
function account(){
  modal(`<h3>Your membership</h3><p class="s">Member · ₹499/month · renews 29 Oct 2026</p>
    <div style="border:1px solid var(--line);padding:16px" class="dek">
      <b>Included</b><br>Every story · the daily brief · live files · full archive</div>
    <button class="go" id="soGo">Sign out</button>`);
  setTimeout(()=>{const b=$('#soGo');if(b)b.onclick=()=>{setMember(false);closeModal();render()}},20);
}
function search(){
  modal(`<h3>Search Snackfax</h3><p class="s">Headlines, sections and reporters.</p>
    <form id="sf"><input id="si" placeholder="quick commerce, AI, protein…" autofocus></form>
    <div class="sug">${['quick commerce','AI','protein','matcha','private label'].map(q=>
      `<button data-go="search:${encodeURIComponent(q)}">${q}</button>`).join('')}</div>`);
  setTimeout(()=>{const f=$('#sf');if(f)f.onsubmit=ev=>{ev.preventDefault();closeModal();go('search:'+encodeURIComponent($('#si').value||''))};$('#si')?.focus()},20);
}
$('#btnSearch').onclick=search; $('#btnSearchM').onclick=search;
function setMember(v){S.member=v;$$('#segMem button').forEach(b=>b.classList.toggle('on',(b.dataset.mem==='1')===v))}
$$('#segMem button').forEach(b=>b.onclick=()=>{setMember(b.dataset.mem==='1');render()});

function wire(){
  $$('[data-sub]').forEach(f=>f.onsubmit=e=>{e.preventDefault();
    const ok=f.parentElement.querySelector('[data-ok]');
    if(ok)ok.textContent='Done — the first brief lands tomorrow at 6.30am.'; f.reset()});
  $$('[data-player]').forEach(initPlayer);
  if($('#log'))drawLog();
}
function initPlayer(root){
  const p=PODS.find(x=>x.id===root.dataset.player)||PODS[0];
  const wave=root.querySelector('[data-wave]'), N=52;
  wave.innerHTML=Array.from({length:N},()=>`<b style="height:${16+Math.random()*84}%"></b>`).join('');
  let t=0,playing=false,spd=1;
  const cap=S.member?p.secs:(p.ch[1]?p.ch[1][1]:p.secs);
  const fm=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  const paint=()=>{
    const pr=t/p.secs; $$('b',wave).forEach((b,i)=>b.classList.toggle('p',i/N<=pr));
    root.querySelector('[data-cur]').textContent=fm(t);
    let ix=0;p.ch.forEach((c,i)=>{if(t>=c[1])ix=i});
    root.querySelector('[data-now]').textContent=p.ch[ix][0];
    $$('[data-chaps] button',root).forEach((b,i)=>b.classList.toggle('on',i===ix));
  };
  paint();
  root.querySelector('[data-pp]').onclick=e=>{playing=!playing;e.currentTarget.textContent=playing?'❚❚':'▶'};
  root.querySelector('[data-spd]').onclick=e=>{spd=spd===1?1.5:spd===1.5?2:1;e.currentTarget.textContent=spd.toFixed(1)+'×'};
  $$('[data-chaps] button',root).forEach((b,i)=>b.onclick=()=>{
    if(i>0&&!S.member){go('subscribe');return} t=p.ch[i][1];paint()});
  wave.onclick=e=>{const r=wave.getBoundingClientRect();
    const want=Math.round((e.clientX-r.left)/r.width*p.secs);
    if(want>cap&&!S.member){go('subscribe');return} t=want;paint()};
  setInterval(()=>{if(!playing)return; t=Math.min(p.secs,t+spd);
    if(t>=cap&&!S.member){playing=false;root.querySelector('[data-pp]').textContent='▶';t=cap;paint();
      root.querySelector('[data-now]').textContent='Chapter one ends here — members hear the rest';return}
    paint(); if(t>=p.secs){playing=false;root.querySelector('[data-pp]').textContent='▶'}},1000);
}
let extra=0;
function drawLog(){
  const el=$('#log'); if(!el)return;
  el.innerHTML=LIVE.log.map(e=>`<div class="logline ${e[2]?'hot':''}"><time>${e[0]}</time><p>${esc(e[1])}</p></div>`).join('');
}
setInterval(()=>{if(extra<LIVE_NEW.length){LIVE.log.unshift([...LIVE_NEW[extra++],1]);drawLog()}},9000);

$$('#segView button').forEach(b=>b.onclick=()=>{
  $$('#segView button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  const m=b.dataset.v==='m';
  document.body.classList.toggle('m',m);
  (m?$('#phSc'):$('#slot')).appendChild($('#app'));
  scrollTo(0,0); render();
});
$('#slot').appendChild($('#app'));
function syncViewport(){
  if(innerWidth<=820&&document.body.classList.contains('m')){
    document.body.classList.remove('m');
    $('#slot').appendChild($('#app'));
    $$('#segView button').forEach(x=>x.classList.toggle('on',x.dataset.v==='d'));
  }
}
addEventListener('resize',syncViewport); syncViewport();
go('home');
</script>
</body>
</html>
